name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: CLI smoke
        run: agent-session-continuity-litmus fixture --profile wait-for-user-state --repetition 2

  public-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public release
        run: python -m pip install "git+https://github.com/itscloud0/agent-session-continuity-litmus@v0.1.0"
      - name: Offline fixture smoke
        run: agent-session-continuity-litmus fixture --profile opaque-task-contract
